  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/me.jpg"
#    bottomImage:
#      enable: true
    content: |-
      I am a software engineer with a passion for building scalable, resilient systems. I have a background in computer science and entrepreneurship. I am currently working as a software developer at [Bitly](https://bitly.com) in Austin, TX.

      I have built and managed Edge systems at [WP Engine](https://wpengine.com) responsible for routing over a million domains correctly to sites.
      
      Prior to that, I worked at [JP Morgan Chase & Co.](https://www.jpmorganchase.com) building and evangelizing internal front and back end frameworks, as well as systems processing and repairing ATM transactions
      
      In my free time I like to read, lift weights, play and watch soccer. I'm a big fan of Chelsea FC and getting lost in a good fantasy novel.
    skills:
      enable: true
      title: "Here are a few technologies I've worked with:"
      items:
        - "Go"
        - "Python"
        - "Java"
        - "JavaScript"
        - "Node"
        - "Ruby"
        - "React"
        - "Vue"
        - "HTML"
        - "CSS"
        - "MySQL"

